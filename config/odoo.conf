[options]
addons_path = /mnt/extra-addons
data_dir = /var/lib/odoo

; Odoo 20 listens on 127.0.0.1 only by default: inside a container that makes
; Odoo unreachable from the browser. The official image does not fix it.
http_interface = 0.0.0.0

; Master password for the database manager. Set it before exposing Odoo.
; admin_passwd = change_me
